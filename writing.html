<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Writing — Hridhaye Bir Singh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF7;--paper-2:#F2EFE8;--ink:#1B2A28;--ink-2:#2f3d3b;
    --muted:#6b7572;--rule:#d8d4c8;--rule-soft:#e8e4d8;
    --green:#2F5D50;--green-dark:#1f4338;--blue:#3A5A7C;--sand:#C9B68B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none;transition:color .15s}
  a:hover{color:var(--green)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 36px}

  .logo-band{background:#fff;padding:30px 0 24px;border-bottom:1px solid var(--rule-soft)}
  .logo-band .row{display:flex;justify-content:center;align-items:center;gap:18px}
  .mark{width:44px;height:44px;border:1.5px solid var(--green-dark);border-radius:50%;display:grid;place-items:center;position:relative}
  .mark::before{content:"";position:absolute;inset:5px;border:1px solid var(--green-dark);border-radius:50%}
  .mark span{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:var(--green-dark);font-style:italic;line-height:1}
  .brand-name{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px;letter-spacing:-.005em;color:var(--green-dark);line-height:1}

  nav.main{background:var(--ink);padding:14px 0}
  nav.main .row{display:flex;justify-content:center;align-items:center;gap:56px;font-family:'Source Serif 4',serif;font-size:15.5px;color:#e8e4d8}
  nav.main a{color:#e8e4d8;padding:4px 2px;position:relative;font-weight:500}
  nav.main a::after{content:"";position:absolute;left:50%;right:50%;bottom:-4px;height:1px;background:var(--sand);transition:left .2s,right .2s}
  nav.main a:hover{color:#fff}
  nav.main a:hover::after,nav.main a.active::after{left:0;right:0}
  nav.main a.active{color:#fff}

  .page-head{background:var(--paper-2);padding:80px 0 72px;border-bottom:1px solid var(--rule-soft);text-align:center}
  .page-head .kicker{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--green);margin-bottom:18px;display:inline-flex;align-items:center;gap:14px}
  .page-head .kicker::before,.page-head .kicker::after{content:"";width:24px;height:1px;background:var(--green);opacity:.5}
  .page-head h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(44px,5vw,62px);line-height:1.05;letter-spacing:-.015em}
  .page-head h1 em{font-style:italic;color:var(--green)}
  .page-head .lede{margin-top:20px;font-size:18px;color:var(--ink-2);max-width:600px;margin-left:auto;margin-right:auto;line-height:1.6}
  .page-head .count{margin-top:24px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  section.listing{padding:40px 0 96px}
  ul.pieces{list-style:none;border-top:1px solid var(--rule)}
  ul.pieces li{border-bottom:1px solid var(--rule-soft)}
  ul.pieces li a.row{display:grid;grid-template-columns:1fr 160px 30px;gap:40px;padding:38px 0;align-items:start}
  ul.pieces li:hover{background:rgba(47,93,80,.035)}
  ul.pieces .mid h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;line-height:1.15;letter-spacing:-.012em;margin-bottom:10px;color:var(--ink)}
  ul.pieces .mid p{font-style:italic;font-size:17px;line-height:1.55;color:var(--ink-2);max-width:680px;margin-bottom:14px}
  ul.pieces .mid .read{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--green);border-bottom:1px solid var(--green);padding-bottom:2px;display:inline-block}
  ul.pieces .cat{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);padding-top:10px;text-align:right;line-height:1.5}
  ul.pieces .arr{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--muted);text-align:right;padding-top:6px;transition:transform .2s,color .2s}
  ul.pieces li:hover .arr{transform:translateX(6px);color:var(--green)}

  .empty{padding:60px 0;text-align:center;font-style:italic;color:var(--muted)}

  footer.site{background:var(--ink);color:#a8b3b0;padding:42px 0 36px}
  footer .row{display:flex;justify-content:space-between;align-items:center;font-family:'Inter',sans-serif;font-size:11.5px}
  footer .l{display:flex;gap:10px;align-items:baseline}
  footer .l b{font-family:'Cormorant Garamond',serif;color:#f2efe8;font-weight:600;font-size:16px;font-style:italic}
  footer .r{display:flex;gap:22px}
  footer .r a:hover{color:#f2efe8}

  @media (max-width:900px){
    .wrap{padding:0 24px}
    nav.main .row{gap:32px;font-size:14px}
    .brand-name{font-size:30px}
    ul.pieces li a.row{grid-template-columns:1fr;gap:14px;padding:28px 0}
    ul.pieces .cat,ul.pieces .arr{text-align:left;padding-top:0}
  }
</style>
</head>
<body>

<nav class="main"><div class="wrap row">
  <a href="index.html">Home</a>
  <a href="writing.html" class="active">Writing</a>
</div></nav>

<div class="logo-band"><div class="wrap row">
  <div class="mark"><span>H</span></div>
  <div class="brand-name">Hridhaye Bir Singh</div>
</div></div>

<header class="page-head"><div class="wrap">
  <div class="kicker">The Archive</div>
  <h1>All <em>writing,</em> in one place.</h1>
  <p class="lede">Reported features, cultural essays, and service journalism.</p>
  <div class="count" id="count">Loading…</div>
</div></header>

<section class="listing"><div class="wrap" id="listing">
  <div class="empty">Loading…</div>
</div></section>

<footer class="site"><div class="wrap row">
  <div class="l"><b>Hridhaye Bir Singh</b><span>© 2026 — All rights reserved.</span></div>
  <div class="r"><a href="mailto:singhhridhaye@gmail.com">Email</a><a href="index.html">Home</a></div>
</div></footer>

<script>
  function esc(s){return (s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function plural(n,w){return n+' '+w+(n===1?'':'s');}

  fetch('articles.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const all = (data.articles || []).slice();
      const listing = document.getElementById('listing');
      const countEl = document.getElementById('count');

      if(!all.length){
        listing.innerHTML = '<div class="empty">No pieces published yet.</div>';
        countEl.textContent = '0 pieces';
        return;
      }

      // flat list, in the manual order they appear in articles.json
      const rows = all.map(a =>
        '<li><a class="row" href="article.html?slug='+encodeURIComponent(a.slug)+'">'+
          '<div class="mid">'+
            '<h3>'+esc(a.title.replace(/\*/g,""))+'</h3>'+
            '<p>'+esc(a.dek)+'</p>'+
            '<span class="read">Read the piece</span>'+
          '</div>'+
          '<div class="cat">'+esc(a.category)+'</div>'+
          '<div class="arr">→</div>'+
        '</a></li>'
      ).join('');
      listing.innerHTML = '<ul class="pieces">'+rows+'</ul>';

      countEl.textContent = plural(all.length,'piece');
    })
    .catch(() => {
      document.getElementById('listing').innerHTML =
        '<div class="empty">Could not load articles — view this through the published site, not a local file.</div>';
      document.getElementById('count').textContent = '';
    });
</script>

</body>
</html>
